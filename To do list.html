<!DOCkkjjhu vTYPE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <style>
      /* Reset & Core Styling */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      /* Main Container Card */
      .todo-card {
        background: #ffffff;
        width: 100%;
        max-width: 500px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        padding: 30px;
        display: flex;
        flex-direction: column;
        max-height: 90vh;
      }

      h1 {
        color: #2d3748;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
      }

      /* Input Row */
      .input-row {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }

      .todo-input {
        flex: 1;
        padding: 14px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s ease;
      }

      .todo-input:focus {
        border-color: #667eea;
      }

      .add-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        border: none;
        padding: 0 24px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s ease, transform 0.1s ease;
      }

      .add-btn:hover {
        opacity: 0.9;
      }

      .add-btn:active {
        transform: scale(0.98);
      }

      /* Filter Buttons Container */
      .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }

      .filter-btn {
        flex: 1;
        padding: 8px 16px;
        border: 2px solid #e2e8f0;
        background: transparent;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #718096;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .filter-btn:hover {
        border-color: #667eea;
        color: #667eea;
      }

      .filter-btn.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-color: transparent;
        color: #ffffff;
      }

      /* Task List Area */
      .task-list-container {
        flex: 1;
        overflow-y: auto;
        margin-bottom: 20px;
        padding-right: 4px;
      }

      /* Custom Blue Scrollbar */
      .task-list-container::-webkit-scrollbar {
        width: 6px;
      }

      .task-list-container::-webkit-scrollbar-track {
        background: #f7fafc;
      }

      .task-list-container::-webkit-scrollbar-thumb {
        background: #4299e1;
        border-radius: 3px;
      }

      .task-list {
        list-style: none;
      }

      /* Task Row Layout */
      .task-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 8px;
        border-bottom: 1px solid #edf2f7;
        gap: 12px;
        animation: fadeIn 0.2s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .task-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        cursor: pointer;
      }

      /* Custom Toggle Checkbox */
      .todo-checkbox {
        appearance: none;
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border: 2px solid #cbd5e0;
        border-radius: 6px;
        cursor: pointer;
        display: grid;
        place-content: center;
        transition: all 0.2s ease;
      }

      .todo-checkbox:checked {
        background: #667eea;
        border-color: #667eea;
      }

      .todo-checkbox::before {
        content: "";
        width: 10px;
        height: 6px;
        border-left: 2px solid white;
        border-bottom: 2px solid white;
        transform: rotate(-45deg) translate(1px, -1px);
        scale: 0;
        transition: transform 0.1s ease-in-out;
      }

      .todo-checkbox:checked::before {
        scale: 1;
      }

      .task-text {
        font-size: 16px;
        color: #2d3748;
        word-break: break-word;
        transition: all 0.2s ease;
      }

      /* Completed Styles */
      .task-item.completed .task-text {
        color: #a0aec0;
        text-decoration: line-through;
      }

      /* Action Buttons */
      .delete-btn {
        background: transparent;
        color: #e53e3e;
        border: 1px solid transparent;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .delete-btn:hover {
        background: #fff5f5;
        border-color: #fed7d7;
      }

      .clear-btn {
        background: transparent;
        color: #e53e3e;
        border: none;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 12px;
        border-radius: 6px;
        transition: all 0.2s ease;
      }

      .clear-btn:hover {
        background: #fff5f5;
      }

      /* Empty State Text */
      .empty-state {
        text-align: center;
        color: #a0aec0;
        font-size: 15px;
        padding: 40px 10px;
      }

      /* Footer Container */
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 16px;
        border-top: 2px solid #edf2f7;
        color: #718096;
        font-size: 14px;
      }

      .remaining-count {
        font-weight: 500;
      }
    </style>
  </head>

  <body>

    <div class="todo-card">
      <h1>My Todo List</h1>

      <!-- Input Area -->
      <div class="input-row">
        <input type="text" id="todoInput" class="todo-input" placeholder="Add a new task..." autocomplete="off">
        <button id="addBtn" class="add-btn">Add</button>
      </div>

      <!-- Filter Navigation -->
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <!-- Dynamic Tasks Scroller -->
      <div class="task-list-container">
        <ul id="taskList" class="task-list"></ul>
        <div id="emptyState" class="empty-state" style="display: none;">No tasks yet. Add one to get started!</div>
      </div>

      <!-- Status & Action Footer -->
      <div class="footer">
        <span id="remainingCount" class="remaining-count">0 tasks remaining</span>
        <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
      </div>
    </div>

    <script>
      // Application State
      let todos = [];
      let currentFilter = 'all';

      // DOM Selectors
      const todoInput = document.getElementById('todoInput');
      const addBtn = document.getElementById('addBtn');
      const taskList = document.getElementById('taskList');
      const emptyState = document.getElementById('emptyState');
      const remainingCount = document.getElementById('remainingCount');
      const clearCompletedBtn = document.getElementById('clearCompletedBtn');
      const filterButtons = document.querySelectorAll('.filter-btn');

      // Add a Task Action
      function addTodo() {
        const text = todoInput.value.trim();
        if (!text) return;

        const newTodo = {
          id: Date.now(),
          text: text,
          completed: false
        };

        // Add new items to the top of the array
        todos.unshift(newTodo);
        todoInput.value = '';
        render();
      }

      // Toggle Task Completed State
      function toggleTodo(id) {
        todos = todos.map(todo => {
          if (todo.id === id) {
            return { ...todo, completed: !todo.completed };
          }
          return todo;
        });
        render();
      }

      // Delete a Task Action
      function deleteTodo(id) {
        todos = todos.filter(todo => todo.id !== id);
        render();
      }

      // Bulk Delete Action
      function clearCompleted() {
        todos = todos.filter(todo => !todo.completed);
        render();
      }

      // Update Filter Context
      function setFilter(filter) {
        currentFilter = filter;
        filterButtons.forEach(btn => {
          if (btn.getAttribute('data-filter') === filter) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        render();
      }

      // Render engine to reconcile DOM with State
      function render() {
        // Filter list pipeline
        const filteredTodos = todos.filter(todo => {
          if (currentFilter === 'active') return !todo.completed;
          if (currentFilter === 'completed') return todo.completed;
          return true;
        });

        // Handle Empty States
        if (filteredTodos.length === 0) {
          taskList.innerHTML = '';
          emptyState.style.display = 'block';
        } else {
          emptyState.style.display = 'none';

          taskList.innerHTML = filteredTodos.map(todo => `
          <li class="task-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
            <div class="task-left" onclick="toggleTodo(${todo.id})">
              <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTodo(${todo.id})">
              <span class="task-text">${escapeHTML(todo.text)}</span>
            </div>
            <button class="delete-btn" onclick="deleteTodo(${todo.id})">Delete</button>
          </li>
        `).join('');
        }

        // Compute Remaining Counter (Always Unchecked count)
        const activeCount = todos.filter(todo => !todo.completed).length;
        remainingCount.textContent = `${activeCount} task${activeCount === 1 ? '' : 's'} remaining`;
      }

      // Helper utilities
      function escapeHTML(str) {
        return str.replace(/[&<>'"]/g,
          function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
              tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
          }

    // Event Registration
    addBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') addTodo();
        });

        clearCompletedBtn.addEventListener('click', clearCompleted);

        filterButtons.forEach(button => {
          button.addEventListener('click', () => {
            setFilter(button.getAttribute('data-filter'));
          });
        });

        // Initial View Render
        render();
    </script>
  </body>

  </html>
